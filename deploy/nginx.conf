# VideoKit static export. Header COOP/COEP berlaku untuk SEMUA respons (dibutuhkan crossOriginIsolated).
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Tipe tambahan yang tidak ada di mime.types bawaan.
  types {
    application/wasm wasm;
    application/octet-stream task vrm;
    font/otf otf;
    font/ttf ttf;
  }

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml font/otf font/ttf;
  gzip_min_length 1024;

  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  # Aset berhash Next.js: cache panjang.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    try_files $uri =404;
  }

  # Vendor (JASSUB, MediaPipe) & font: berubah hanya saat rilis, cache 7 hari.
  location ~ ^/(vendor|fonts)/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    try_files $uri =404;
  }

  # Halaman (trailingSlash: /subtitle-video/ → /subtitle-video/index.html): selalu cek ulang.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    try_files $uri $uri/index.html $uri/ =404;
  }

  error_page 404 /404.html;
}
