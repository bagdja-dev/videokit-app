# VideoKit static export (Next.js output: 'export') — nginx untuk Coolify, port 3000.
#
# Catatan nginx yang penting:
# - JANGAN menaruh blok `types { }` di sini: itu MENGGANTI seluruh mime.types bawaan (js/css/html jadi salah tipe).
#   mime.types bawaan nginx 1.28 sudah memuat wasm; font/model dimuat app lewat fetch (tipe tidak berpengaruh).
# - `add_header` di dalam `location` MENGHAPUS header tingkat server → header keamanan diulang per location
#   lewat snippet di bawah (COOP/COEP wajib di SEMUA respons: crossOriginIsolated untuk JASSUB multi-thread).
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Aset berhash Next.js: cache panjang.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Vendor (JASSUB, MediaPipe) & font: berubah hanya saat rilis → cache 7 hari.
  location ~ ^/(vendor|fonts)/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Halaman (trailingSlash: /subtitle-video/ → /subtitle-video/index.html): selalu divalidasi ulang.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/index.html $uri/ =404;
  }

  error_page 404 /404.html;
}
